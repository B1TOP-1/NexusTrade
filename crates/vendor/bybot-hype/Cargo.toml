[package]
name = "bybot-hype"
version = "0.1.0"
edition = "2021"

[lib]
name = "bybot_hype"
path = "src/lib.rs"

[features]
default = ["execution"]
execution = ["dep:hypersdk"]

[dependencies]
anyhow = "1"
futures-util = "0.3.31"
hypersdk = { version = "0.2.14", optional = true }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = "1.39"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

