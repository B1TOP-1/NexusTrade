[package]
name = "bybot-lighter"
version = "0.1.0"
edition = "2021"

[lib]
name = "bybot_lighter"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3.31"
rust_decimal = "1.42"
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "query", "rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
rust_decimal_macros = "1.40"
