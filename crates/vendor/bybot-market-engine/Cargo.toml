[package]
name = "bybot-market-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3.31"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }

[lib]
name = "bybot_market_engine"
path = "src/lib.rs"

[[bin]]
name = "bybot-market-engine"
path = "src/main.rs"
