[package]
name = "nexus-binance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NexusTrade Binance Futures venue adapter：行情（depth@100ms 增量）、WS 下单、用户数据流、HMAC 签名。"

[dependencies]
nexus-core = { path = "../../nexus-core" }
nexus-book = { path = "../../nexus-book" }
nexus-net = { path = "../../nexus-net" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde = { workspace = true }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rust_decimal = { workspace = true }
async-trait = { workspace = true }
chrono = "0.4"

[dev-dependencies]
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "net", "io-util", "rt-multi-thread"] }
