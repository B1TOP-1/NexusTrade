[package]
name = "nexus-gate"
readme = "README.md"
version = "0.1.0"
edition = "2024"
description = "Gate exchange data adapter (decoupled from Nautilus, nexus-core traits)"
license = "MIT"

[lib]
name = "nexus_gate"
crate-type = ["rlib"]

[dependencies]
nexus-core = { path = "../../nexus-core" }
nexus-book = { path = "../../nexus-book" }
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
anyhow = "1"
async-trait = "0.1"
aws-lc-rs = "1"
futures-util = "0.3"
log = "0.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
ustr = { version = "1", features = ["serde"] }

[dev-dependencies]
rstest = "0.18"
